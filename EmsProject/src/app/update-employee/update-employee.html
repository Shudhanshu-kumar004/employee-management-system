<div class="min-h-screen bg-gray-50 p-6">
  <div class="mx-auto max-w-7xl">

    <div>
        <button
            (click)="goBackToManageEmployee()"
            class="text-blue-600 text-sm hover:underline mb-2">
            ← Back to Manage Employee
        </button>
    </div>

    <!-- Heading -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-slate-800">Update Employee</h1>
      <p class="mt-2 text-slate-500">
        Update employee information in the Employee Management System.
      </p>
    </div>

    <!-- Form Card -->
    <div class="rounded-3xl border border-gray-200 bg-white p-8 shadow-sm">

      <form [formGroup]="employeeForm" (ngSubmit)="updateEmployee()">

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

          <!-- Full Name -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Full Name
            </label>
            <input
              type="text"
              formControlName="name"
              (focus)="onFocus('name')"
              (blur)="onBlur('name')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Email -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Email
            </label>
            <input
              type="email"
              formControlName="emailId"
              (focus)="onFocus('emailId')"
              (blur)="onBlur('emailId')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Phone -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Phone Number
            </label>
            <input
              type="text"
              formControlName="phoneNumber"
              (focus)="onFocus('phoneNumber')"
              (blur)="onBlur('phoneNumber')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Password -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Password
            </label>
            <input
              type="password"
              formControlName="password"
              class="h-14 w-full cursor-not-allowed rounded-xl border border-gray-200 bg-gray-100 px-4 text-gray-400">
          </div>

          <!-- Role -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Role
            </label>
            <input
              type="text"
              formControlName="role"
              class="h-14 w-full cursor-not-allowed rounded-xl border border-gray-200 bg-gray-100 px-4 text-gray-400">
          </div>

          <!-- Department -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Department
            </label>
            <input
              type="text"
              formControlName="department"
              (focus)="onFocus('department')"
              (blur)="onBlur('department')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Designation -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Designation
            </label>
            <input
              type="text"
              formControlName="designation"
              (focus)="onFocus('designation')"
              (blur)="onBlur('designation')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Salary -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Salary
            </label>
            <input
              type="number"
              formControlName="salary"
              (focus)="onFocus('salary')"
              (blur)="onBlur('salary')"
              class="h-14 w-full rounded-xl border border-gray-300 px-4 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900">
          </div>

          <!-- Status -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Status
            </label>
            <input
              type="text"
              formControlName="status"
              class="h-14 w-full cursor-not-allowed rounded-xl border border-gray-200 bg-gray-100 px-4 text-gray-400">
          </div>

          <!-- Joining Date -->
          <div>
            <label class="mb-2 block text-sm font-semibold text-gray-700">
              Joining Date
            </label>
            <input
              type="date"
              formControlName="joiningDate"
              class="h-14 w-full cursor-not-allowed rounded-xl border border-gray-200 bg-gray-100 px-4 text-gray-400">
          </div>

        </div>

        <!-- Address -->
        <div class="mt-6">
          <label class="mb-2 block text-sm font-semibold text-gray-700">
            Address
          </label>
          <textarea
            rows="5"
            formControlName="address"
            (focus)="onFocus('address')"
            (blur)="onBlur('address')"
            class="w-full rounded-xl border border-gray-300 px-4 py-3 text-gray-400 outline-none transition focus:border-blue-500 focus:text-gray-900"></textarea>
        </div>

        <!-- Buttons -->
        <div class="mt-8 flex justify-end gap-4">

          <button
            type="button"
            class="rounded-xl border border-gray-300 px-8 py-3 font-medium text-gray-700 transition hover:bg-gray-100">
            Cancel
          </button>

          <button
            type="submit"
            class="rounded-xl bg-blue-500 px-8 py-3 font-medium text-white transition hover:bg-blue-600">
            Update Employee
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
